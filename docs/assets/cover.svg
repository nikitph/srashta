<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">Srashta — turn a spec into work you can reason about.</title>
<desc id="desc">An explicit ticket graph connects a specification to your executor.</desc>
