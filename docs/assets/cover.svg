<text x="64" y="195" fill="#193b42" font-family="Georgia,serif" font-size="64">Turn a spec into work</text>
<text x="64" y="269" fill="#193b42" font-family="Georgia,serif" font-size="64">you can reason about.</text>
<text x="66" y="327" fill="#667578" font-family="Arial,sans-serif" font-size="21">Explicit dependencies. Bounded scope. Your executor.</text>
