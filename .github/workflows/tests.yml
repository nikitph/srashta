name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest jsonschema build
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Verify packaged CLI and templates
        run: |
          python -m venv /tmp/srashta-installed
          /tmp/srashta-installed/bin/pip install dist/*.whl
          cd /tmp
          /tmp/srashta-installed/bin/srashta --version
          /tmp/srashta-installed/bin/srashta init package-smoke --stack none
