name: Srashta API and ticket checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/srashta-ci.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'PyYAML>=6,<7'
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3'}
      - name: Install application
        if: hashFiles('composer.json') != ''
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch /tmp/srashta-ci.sqlite
          php artisan migrate --force
      - name: Check PR against its base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Execute the validator from the trusted base, not candidate Python edits.
          mkdir -p "$RUNNER_TEMP/srashta-base"
          git archive "$BASE" .srashta/runtime | tar -x -C "$RUNNER_TEMP/srashta-base"
          export PYTHONPATH="$RUNNER_TEMP/srashta-base/.srashta/runtime"
          python -m srashta api check --base "$BASE"
          if [[ "$BRANCH" =~ ^([CTI]-[0-9]{2,3}[a-z]?)- ]]; then
            TICKET="${BASH_REMATCH[1]}"
            # IDs must be project-unique. Refuse ambiguity rather than select a phase.
            PHASE=$(python "$RUNNER_TEMP/srashta-base/.srashta/runtime/srashta/ticket_phase.py" "$BASE" "$TICKET")
            python -m srashta verify "$PHASE" "$TICKET" --base "$BASE"
          else
            echo 'Planning/contract-change branch: human review required.'
          fi
      - name: Generate current API artifact
        env:
          PYTHONPATH: .srashta/runtime
        run: python -m srashta api generate
      - uses: actions/upload-artifact@v4
        with:
          name: api-and-evidence
          path: |
            docs/openapi.*
            evidence/
